[workspace]
authors = ["Cade Mirchandani <cmirchan@ucsc.edu>"]
channels = ["conda-forge"]
name = "pbzarr.github.io"
platforms = ["osx-arm64", "osx-64", "linux-64"]
version = "0.1.0"

[tasks]
serve = "zensical serve"
build = "zensical build --clean"


[dependencies]
python = ">=3.14.3,<3.15"

[pypi-dependencies]
zensical = ">=0.0.29, <0.0.30"
mkdocstrings = { version = ">=0.28", extras = ["python"] }
pbzarr = { git = "https://github.com/pbzarr/pbzarr-py.git"}
mkdocs-autorefs = ">=1.4.4, <2"
