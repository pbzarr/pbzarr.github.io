[project]
site_name = "pbzarr"
site_url = "https://pbzarr.github.io"
site_description = "Documentation for pbzarr"
copyright = "Copyright &copy; 2024–2026 Cade Mirchandani"

nav = [
  { "Home" = "index.md" },
  { "Specification" = "spec/index.md" },
  { "Python" = [
    { "Quickstart" = "python/quickstart.md" },
    { "API Reference" = "python/api.md" },
    { "Backends" = "python/backends.md" },
  ] },
  { "Rust" = [
    { "Quickstart" = "rust/quickstart.md" },
    { "API Reference" = "rust/api.md" },
  ] },
  { "CLI" = "cli/index.md" },
  { "Design" = [
    { "Architecture" = "design/architecture.md" },
    { "Comparison" = "design/comparison.md" },
  ] },
]

[project.theme]
logo = "assets/pbzarr-icon.svg"
language = "en"
custom_dir = "overrides"
features = [
    "content.code.copy",
    "content.code.annotate",
    "content.tabs.link",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"

[project.plugins.mkdocstrings]
enabled = true
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["../pbzarr-py/src"]

# Markdown extensions
[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
