name: Build and deploy docs

on:
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit of pbzarr/pbzarr to build
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.ref || github.event.client_payload.ref }}
        run: |
          ref="${REQUESTED:-$(gh release view --repo pbzarr/pbzarr --json tagName --jq .tagName)}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building docs from pbzarr/pbzarr at $ref"

      - uses: actions/checkout@v5
        with:
          repository: pbzarr/pbzarr
          ref: ${{ steps.ref.outputs.ref }}

      - uses: actions/configure-pages@v5

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.1
          environments: docs
          cache: true

      - run: pixi run -e docs docs-build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
